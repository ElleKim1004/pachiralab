<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
{%- seo -%}
{%- feed_meta -%}
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="{{ '/' | relative_url }}" class="brand">
      <img class="nav-logo" src="{{ '/assets/pachiralab-logo.png' | relative_url }}" alt="파키라랩 PACHIRALAB">
    </a>
    <nav class="links">
      <a href="{{ '/#core' | relative_url }}">핵심 서비스</a>
      <a href="{{ '/#services-2' | relative_url }}">인증·정부지원</a>

      <a href="{{ '/clinic/' | relative_url }}">현장클리닉</a>
      <a href="{{ '/notice/' | relative_url }}">공지사항</a>
      <a href="{{ '/news/' | relative_url }}">뉴스</a>
    </nav>
    <a href="{{ '/#contact' | relative_url }}" class="nav-cta">무료 상담 신청</a>
  </div>
</header>

{{ content }}

<footer>
  <div class="wrap">
    <div class="footer-inner">
      <div class="footer-brand">
        <img class="footer-logo" src="{{ '/assets/pachiralab-logo.png' | relative_url }}" alt="파키라랩 PACHIRALAB">
        <p class="footer-tag">Bringing Value, Driving Success.</p>
      </div>
      <div class="footer-social">
        <a class="sns" href="https://blog.naver.com/pachiralab" target="_blank" rel="noopener" aria-label="파키라랩 네이버 블로그">
          <svg viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect width="22" height="22" rx="5" fill="#03C75A"/>
            <path d="M8.1 6.6h2.6l2.5 3.9V6.6h2.7v8.8h-2.6l-2.5-3.9v3.9H8.1z" fill="#fff"/>
          </svg>
          <span>네이버 블로그</span>
        </a>
        <a class="sns" href="https://www.instagram.com/valuecreator.elle" target="_blank" rel="noopener" aria-label="파키라랩 인스타그램">
          <svg viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="igGrad" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#FEDA75"/>
                <stop offset="0.3" stop-color="#FA7E1E"/>
                <stop offset="0.6" stop-color="#D62976"/>
                <stop offset="0.82" stop-color="#962FBF"/>
                <stop offset="1" stop-color="#4F5BD5"/>
              </linearGradient>
            </defs>
            <rect width="22" height="22" rx="5" fill="url(#igGrad)"/>
            <rect x="5.6" y="5.6" width="10.8" height="10.8" rx="3.3" fill="none" stroke="#fff" stroke-width="1.5"/>
            <circle cx="11" cy="11" r="2.7" fill="none" stroke="#fff" stroke-width="1.5"/>
            <circle cx="14.7" cy="7.4" r="0.95" fill="#fff"/>
          </svg>
          <span>인스타그램</span>
        </a>
      </div>
    </div>
    <div class="footer-bottom">
      <p class="fine">© 2026 파키라랩(PachiraLab). "Bringing Value, Driving Success."</p>
    </div>
  </div>
</footer>
