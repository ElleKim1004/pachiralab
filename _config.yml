title: "파키라랩 PACHIRALAB"
tagline: "Bringing Value, Driving Success."
description: "오픈이노베이션, 사내벤처 운영, 액셀러레이터, 투자유치·IR부터 인증·정부지원사업까지 — 파키라랩이 단계별로 함께합니다."
url: "https://pachira.kr"
baseurl: ""
lang: ko

author:
  name: 파키라랩

logo: /assets/pachiralab-logo.png

# 글 주소: /카테고리/글제목/  (예: /open-innovation/how-to-write/)
permalink: /:categories/:title/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: /feed.xml

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# 카테고리 한글 이름표 — 새 게시판을 추가할 땐 여기와 폴더를 같이 만들면 됩니다.
category_names:
  open-innovation: "오픈이노베이션"
  corporate-venture: "사내벤처"
  accelerator: "액셀러레이터"
  investment-ir: "투자유치·IR"
  certification-support: "인증·정부지원사업"
  management-brand: "경영·브랜드"
  notice: "공지사항"
  news: "뉴스"

# 인사이트 허브에 묶이는 카테고리(공지·뉴스 제외)
insight_categories:
  - open-innovation
  - corporate-venture
  - accelerator
  - investment-ir
  - certification-support
  - management-brand

# 연재 시리즈 설정 — 새 시리즈를 만들 땐 여기에 4줄만 추가하면 됩니다.
series_order:
  - column
  - basics

series_names:
  column: "오픈이노베이션 시사 칼럼"
  basics: "오픈이노베이션 기초편"

series_desc:
  column: "지금 벌어지고 있는 오픈이노베이션 정책·사례를 한 편씩 짚어봅니다."
  basics: "오픈이노베이션이 무엇인지부터 차근차근 짚어보는 입문 연재입니다."

series_total:
  column: 10
  basics: 30

exclude:
  - README.md
  - POSTING-GUIDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
